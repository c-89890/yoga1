<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<button id="beep" style="font-size:20px;padding:20px;margin:16px">① 播放蜂鸣</button>
<button id="b" style="font-size:20px;padding:20px;margin:16px">② 朗读测试</button>
<div id="log" style="padding:0 16px;font-size:14px;white-space:pre-line"></div>
<script>
const log = t => document.getElementById('log').textContent += t + "\n";

document.getElementById('beep').onclick = () => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  ctx.resume();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.frequency.value = 880;
  gain.gain.value = 0.3;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 1);
  log("蜂鸣已播放 1 秒");
};

document.getElementById('b').onclick = () => {
  const s = speechSynthesis;
  const vs = s.getVoices();
  log("语音包数量：" + vs.length);
  log("语音包内容：" + vs.map(v => v.lang + " " + v.name).join(", "));
  const u = new SpeechSynthesisUtterance("测试语音，一二三四五");
  u.lang = "zh-CN"; u.volume = 1; u.rate = 0.9;
  u.onstart = () => log("onstart 触发");
  u.onend = () => log("onend 触发");
  u.onerror = e => log("error: " + e.error);
  s.speak(u);
};
</script>
