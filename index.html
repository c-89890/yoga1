<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Yoga Coach · 实时瑜伽姿态检测</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0f14">
<style>
  :root{--bg:#0b0f14;--card:#141a22;--line:#233040;--fg:#e9eef5;--dim:#8fa1b5;
        --ok:#3ddc97;--warn:#ffb020;--bad:#ff5d5d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overscroll-behavior:none;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
  header .dot.on{background:var(--ok)}
  main{flex:1;display:flex;flex-direction:column;min-height:0}
  .stage{position:relative;flex:1;background:#000;overflow:hidden;min-height:0}
 #video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #video{transform:scaleX(-1)}
  #overlay{transform:scaleX(-1);pointer-events:none}
  .hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .score-card{display:flex;align-items:baseline;gap:6px;background:rgba(10,15,20,.55);
    backdrop-filter:blur(8px);padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08)}
  .grade{font-size:13px;color:var(--dim)}
  .num{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok)}
  .unit{font-size:12px;color:var(--dim)}
  .hold,.fps{font-size:12px;color:#cfe0f0;background:rgba(10,15,20,.5);padding:3px 9px;border-radius:9px;width:max-content}
  .cues{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .cue{background:rgba(255,176,32,.16);border-left:3px solid var(--warn);color:#ffdca8;
    padding:7px 11px;border-radius:8px;font-size:13px;backdrop-filter:blur(6px)}
  .splash{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,9,13,.92);
    transition:opacity .35s;padding:20px;text-align:center}
  .splash.hide{opacity:0;pointer-events:none}
  .splash h2{margin:0 0 8px;font-size:19px}
  .splash p{color:var(--dim);margin:6px 0;font-size:13px}
  button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:9px 14px;cursor:pointer;transition:.15s}
  button:active{transform:scale(.97)}
  button.primary{background:linear-gradient(135deg,#1f6f4a,#2fae74);border-color:#2fae74;
    font-weight:600;padding:11px 26px;margin-top:14px}
  button.on{border-color:var(--ok);color:var(--ok)}
  button:disabled{opacity:.5}
  .panel{border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));
    background:var(--card);display:flex;flex-direction:column;gap:9px;max-height:42vh;overflow:auto}
  .row{display:flex;align-items:center;gap:8px}
  .row label{color:var(--dim);font-size:12px;white-space:nowrap}
  select{flex:1;font:inherit;color:var(--fg);background:#0f151c;border:1px solid var(--line);
    border-radius:10px;padding:9px 10px}
  .btns button{flex:1;font-size:12.5px;padding:8px 6px}
  .rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .rule{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim)}
  .rule .bar{flex:0 0 54px;height:5px;border-radius:3px;background:#1d2733;overflow:hidden}
  .rule .bar i{display:block;height:100%;width:0;background:var(--dim);transition:width .18s}
  .rule.ok .bar i{background:var(--ok)} .rule.ok{color:#bfe9d6}
  .rule.warn .bar i{background:var(--warn)} .rule.warn{color:#ffe0ad}
  .rule.bad .bar i{background:var(--bad)} .rule.bad{color:#ffc4c4}
  .hr{font-size:12.5px;color:#ff8f8f}
  @media(min-width:900px){
    main{flex-direction:row}
    .stage{flex:1}
    .panel{width:320px;max-height:none;border-top:none;border-left:1px solid var(--line)}
  }
    .stat{font-size:12.5px;color:var(--dim);padding:2px 2px}
  .suggest{font-size:12.5px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4);
    color:#a9efcd;padding:8px 10px;border-radius:10px;cursor:pointer}
  .drawer{position:fixed;inset:0;background:rgba(6,9,13,.96);z-index:50;
    display:flex;flex-direction:column;padding:14px}
  .drawer[hidden]{display:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:10px;border-bottom:1px solid var(--line)}
  .drawer-body{flex:1;overflow:auto;display:grid;gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding:12px 0}
  .drawer-body .empty{grid-column:1/-1;color:var(--dim);font-size:13px;text-align:center;padding:40px 0}
  .snap{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .snap img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
  .snap figcaption{display:flex;flex-direction:column;gap:2px;padding:8px;font-size:12px;color:var(--dim)}
  .snap figcaption b{font-size:17px}
  .snap-btns{display:flex;gap:6px;margin-top:4px}
  .snap-btns button{flex:1;padding:5px 4px;font-size:11.5px;border-radius:8px}
  .drawer-foot{padding-top:10px;border-top:1px solid var(--line)}
  .drawer-foot button{width:100%;padding:10px;color:#ff8f8f;border-color:#4a2b2b}
  .toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,10px);opacity:0;
    background:rgba(20,26,34,.96);border:1px solid var(--line);padding:10px 16px;
    border-radius:12px;font-size:13px;pointer-events:none;transition:.25s;z-index:60;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width: 899px){
    .panel{max-height:28vh;gap:6px;padding:8px 10px}
    .rules{display:none}          /* 手机上隐藏规则列表，省空间 */
    .num{font-size:26px}
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Yoga Coach · 实时姿态检测</h1>
</header>

<main>
  <div class="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <div class="hud">
      <div class="score-card">
        <span class="grade" id="grade">--</span>
        <span class="num" id="score">0</span><span class="unit">分</span>
      </div>
      <div class="hold" id="hold">保持 0.0s</div>
      <div class="fps" id="fps">-- fps</div>
    </div>

    <div class="cues" id="cues"></div>

    <div class="splash" id="splash">
      <div>
        <h2>开始你的练习</h2>
        <p>把手机/电脑放在 1.5~2.5 米处，确保全身入镜</p>
        <p>正面或侧身站立，光线均匀，背景尽量干净</p>
        <button class="primary" id="startBtn">开启摄像头</button>
        <p id="splashHint"></p>
      </div>
    </div>
  </div>

  <aside class="panel">
    <div class="row">
      <label for="poseSelect">动作</label>
      <select id="poseSelect"></select>
    </div>
        <div class="row btns">
      <button id="castBtn">📺 投屏</button>
      <button id="bleBtn">❤️ 心率带</button>
      <button id="flipBtn">🔄 镜头</button>
    </div>
    <div class="row btns">
      <button id="snapBtn">📸 定格</button>
      <button id="voiceBtn" class="on">🔊 语音</button>
      <button id="galleryBtn">🖼 记录</button>
    </div>
    <div class="row">
      <label for="qualitySel">精度</label>
      <select id="qualitySel">
        <option value="speed">流畅（lite · 640p）</option>
        <option value="balanced" selected>均衡（lite · 960p）</option>
        <option value="accurate">精细（full · 1280p）</option>
      </select>
    </div>
    <div class="stat" id="statLine">—</div>
    <div class="suggest" id="suggest" hidden></div>

    <ul class="rules" id="ruleList"></ul>
    <div class="hr" id="hrBox" hidden>心率：<b id="hr">--</b> bpm</div>
  </aside>
      <div class="drawer" id="gallery" hidden>
      <div class="drawer-head">
        <b>定格记录</b>
        <button id="galleryClose">关闭</button>
      </div>
      <div class="drawer-body" id="galleryList"></div>
      <div class="drawer-foot"><button id="galleryClear">清空全部</button></div>
    </div>
    <div class="toast" id="toast"></div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
